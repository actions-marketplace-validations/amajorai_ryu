name: Publish Rust SDK crates

# The Rust SDK crates share a small published dependency chain. Keep this
# publisher on the public mirror, where Actions is available, and publish only
# the crates that changed with the release train. A missing token is a clean
# no-op; the test job still proves the chain can build from the mirrored tree.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Rust SDK crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Test kernel contracts and SDK bindings
        run: |
          set -euo pipefail
          cargo test --manifest-path crates/core/kernel-contracts/Cargo.toml
          cargo test --manifest-path crates/sdk/core/Cargo.toml
          cargo test --manifest-path crates/sdk/ffi/Cargo.toml
          cargo test --manifest-path crates/sdk/uniffi/Cargo.toml

  publish:
    name: Publish changed crates
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_CARGO: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - name: Skip notice
        if: env.HAS_CARGO != 'true'
        run: echo "CARGO_REGISTRY_TOKEN is not configured; skipping crates.io publish."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: env.HAS_CARGO == 'true'
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        if: env.HAS_CARGO == 'true'
      - name: Publish dependency chain
        if: env.HAS_CARGO == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version_for() {
            sed -n 's/^version = "\([^"]*\)"/\1/p' "$1/Cargo.toml" | head -1
          }

          published() {
            local name="$1" version="$2"
            curl -fsSL --max-time 30 "https://crates.io/api/v1/crates/$name/versions" \
              | python3 -c 'import json, sys; d=json.load(sys.stdin); raise SystemExit(0 if sys.argv[1] in {v["num"] for v in d.get("versions", [])} else 1)' "$version"
          }

          wait_until_published() {
            local name="$1" version="$2"
            for attempt in $(seq 1 30); do
              if published "$name" "$version"; then return 0; fi
              echo "Waiting for $name@$version to appear in the crates.io index (attempt $attempt/30)."
              sleep 10
            done
            echo "Timed out waiting for $name@$version in the crates.io index." >&2
            return 1
          }

          publish_one() {
            local name="$1" path="$2" version
            version="$(version_for "$path")"
            if published "$name" "$version"; then
              echo "$name@$version already published; continuing."
            else
              cargo publish --token "$CARGO_REGISTRY_TOKEN" --manifest-path "$path/Cargo.toml"
            fi
            wait_until_published "$name" "$version"
          }

          publish_one ryu-kernel-contracts crates/core/kernel-contracts
          publish_one ryu-sdk crates/sdk/core
          publish_one ryu-sdk-ffi crates/sdk/ffi
          publish_one ryu-sdk-uniffi crates/sdk/uniffi

<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>ResolveDesk support</title>
	<style>
		:root {
			color-scheme: light;
			--ink: #10151d;
			--muted: #68727e;
			--line: #e2e7e8;
			--paper: #fcfbf8;
			--soft: #f2f5f3;
			--signal: #f06445;
			--signal-soft: #fff0eb;
			--teal: #176b63;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			background: var(--paper);
			color: var(--ink);
			font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		}
		button, input { font: inherit; }
		button { cursor: pointer; }
		button:focus-visible, input:focus-visible {
			outline: 3px solid color-mix(in srgb, var(--signal) 32%, transparent);
			outline-offset: 2px;
		}
		.widget {
			width: min(100%, 440px);
			margin: 0 auto;
			overflow: hidden;
			background: var(--paper);
			border: 1px solid var(--line);
			border-radius: 22px;
			box-shadow: 0 22px 60px rgb(16 21 29 / 12%);
		}
		.header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 17px 18px 15px;
			background: var(--ink);
			color: #fff;
		}
		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
			font-size: 14px;
			font-weight: 720;
			letter-spacing: -.01em;
		}
		.brand-mark {
			display: grid;
			width: 26px;
			height: 26px;
			place-items: center;
			background: var(--signal);
			border-radius: 8px 8px 8px 2px;
			font-size: 13px;
			font-weight: 800;
		}
		.header-meta {
			display: flex;
			align-items: center;
			gap: 7px;
			color: #b9c2c8;
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 10px;
			letter-spacing: .08em;
			text-transform: uppercase;
		}
		.live-dot {
			width: 7px;
			height: 7px;
			background: #78d8b6;
			border-radius: 50%;
			box-shadow: 0 0 0 4px rgb(120 216 182 / 13%);
		}
		.thread {
			display: flex;
			min-height: 270px;
			max-height: 365px;
			flex-direction: column;
			gap: 13px;
			padding: 20px 18px 15px;
			overflow: auto;
		}
		.message-row { display: flex; gap: 9px; align-items: flex-end; }
		.message-row.user { justify-content: flex-end; }
		.avatar {
			display: grid;
			flex: 0 0 auto;
			width: 24px;
			height: 24px;
			place-items: center;
			background: var(--soft);
			border-radius: 8px 8px 8px 2px;
			color: var(--teal);
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 10px;
			font-weight: 800;
		}
		.bubble {
			max-width: 83%;
			padding: 11px 13px;
			border: 1px solid var(--line);
			border-radius: 15px 15px 15px 4px;
			background: #fff;
			font-size: 13px;
			line-height: 1.48;
		}
		.user .bubble {
			border-color: var(--ink);
			border-radius: 15px 15px 4px 15px;
			background: var(--ink);
			color: #fff;
		}
		.timestamp {
			margin-top: 5px;
			color: var(--muted);
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 9px;
			letter-spacing: .07em;
			text-transform: uppercase;
		}
		.sources {
			display: flex;
			flex-wrap: wrap;
			gap: 6px;
			padding: 0 18px 16px;
		}
		.source {
			display: inline-flex;
			align-items: center;
			gap: 6px;
			padding: 5px 8px;
			border: 1px solid #cfe5df;
			border-radius: 999px;
			background: #f0f8f5;
			color: var(--teal);
			font-size: 10px;
			font-weight: 650;
		}
		.source::before { content: "↗"; font-size: 11px; }
		.quick-replies {
			display: flex;
			gap: 7px;
			padding: 0 18px 15px;
			overflow-x: auto;
		}
		.quick-reply {
			flex: 0 0 auto;
			padding: 7px 10px;
			border: 1px solid #f3c4b7;
			border-radius: 999px;
			background: var(--signal-soft);
			color: #a43e2a;
			font-size: 11px;
			font-weight: 650;
		}
		.quick-reply:hover { background: #ffe5dc; }
		.composer {
			display: flex;
			align-items: center;
			gap: 8px;
			padding: 12px;
			border-top: 1px solid var(--line);
			background: #fff;
		}
		.composer input {
			min-width: 0;
			flex: 1;
			padding: 10px 11px;
			border: 1px solid var(--line);
			border-radius: 11px;
			background: var(--paper);
			color: var(--ink);
			font-size: 12px;
		}
		.composer input::placeholder { color: #9ba4aa; }
		.send, .handoff {
			display: grid;
			flex: 0 0 auto;
			width: 35px;
			height: 35px;
			place-items: center;
			border: 0;
			border-radius: 10px;
			font-size: 14px;
		}
		.send { background: var(--signal); color: #fff; }
		.send:hover { background: #d95337; }
		.handoff { background: var(--soft); color: var(--teal); }
		.handoff:hover { background: #e4eeeb; }
		.footer {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			padding: 9px 14px 11px;
			color: var(--muted);
			font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
			font-size: 9px;
			letter-spacing: .02em;
		}
		.footer strong { color: var(--teal); font-weight: 700; }
		.status { color: var(--signal); }
		@media (prefers-reduced-motion: no-preference) {
			.widget { animation: arrive .45s cubic-bezier(.2,.8,.2,1) both; }
			@keyframes arrive { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
		}
	</style>
</head>
<body>
	<main class="widget" data-testid="support-widget">
		<header class="header">
			<div class="brand"><span class="brand-mark">R</span><span>ResolveDesk support</span></div>
			<div class="header-meta"><span class="live-dot"></span><span>online</span></div>
		</header>
		<section class="thread" id="thread" aria-live="polite"></section>
		<div class="sources" id="sources" aria-label="Sources"></div>
		<div class="quick-replies" id="quick-replies" aria-label="Suggested questions"></div>
		<form class="composer" id="composer">
			<input id="message" autocomplete="off" maxlength="800" placeholder="Ask about billing, exports, access…" aria-label="Support question">
			<button class="handoff" id="handoff" type="button" title="Request a human" aria-label="Request a human">↗</button>
			<button class="send" type="submit" title="Send question" aria-label="Send question">↑</button>
		</form>
		<footer class="footer"><span><strong>Ryu</strong> governed runtime</span><span class="status" id="runtime-status">grounded preview</span></footer>
	</main>
	<script type="module">
		const bridge = window.ryu ?? window.openai ?? {};
		const fallback = {
			answer: "Hi — I can help with billing, reports, exports, and workspace access. What are you trying to do?",
			handoff: true,
			mode: "grounded",
			sources: [{ label: "ResolveDesk help center", excerpt: "Support coverage" }],
			suggestedReplies: ["How do refunds work?", "How do I export a report?"]
		};
		const state = { payload: bridge.toolOutput?.answer ? bridge.toolOutput : fallback, messages: [] };
		const thread = document.getElementById("thread");
		const sources = document.getElementById("sources");
		const quickReplies = document.getElementById("quick-replies");
		const messageInput = document.getElementById("message");
		const status = document.getElementById("runtime-status");

		function el(tag, className, text) {
			const node = document.createElement(tag);
			if (className) node.className = className;
			if (text !== undefined) node.textContent = text;
			return node;
		}

		function currentMessages() {
			const saved = bridge.widgetState?.messages;
			return Array.isArray(saved) ? saved : state.messages;
		}

		function renderMessages() {
			thread.replaceChildren();
			for (const item of currentMessages()) {
				const row = el("div", `message-row ${item.role}`);
				if (item.role === "assistant") row.appendChild(el("span", "avatar", "R"));
				const body = el("div");
				body.appendChild(el("div", "bubble", item.text));
				body.appendChild(el("div", "timestamp", item.role === "assistant" ? "ResolveDesk · verified" : "you"));
				row.appendChild(body);
				thread.appendChild(row);
			}
			thread.scrollTop = thread.scrollHeight;
		}

		function saveMessages() {
			bridge.setWidgetState?.({ ...(bridge.widgetState ?? {}), messages: state.messages });
		}

		function renderPayload(payload, question) {
			state.payload = payload ?? fallback;
			state.messages = [
				...(question ? [{ role: "user", text: question }] : []),
				{ role: "assistant", text: state.payload.answer ?? fallback.answer }
			];
			saveMessages();
			status.textContent = state.payload.mode === "ai" ? "gateway model" : "grounded preview";
			thread.replaceChildren();
			renderMessages();
			sources.replaceChildren();
			for (const source of state.payload.sources ?? []) sources.appendChild(el("span", "source", source.label));
			quickReplies.replaceChildren();
			for (const suggestion of state.payload.suggestedReplies ?? []) {
				const button = el("button", "quick-reply", suggestion);
				button.type = "button";
				button.addEventListener("click", () => ask(suggestion));
				quickReplies.appendChild(button);
			}
			bridge.notifyIntrinsicHeight?.(document.body.scrollHeight);
		}

		function ask(question) {
			const text = String(question ?? "").trim().slice(0, 800);
			if (!text) return;
			messageInput.value = "";
			if (typeof bridge.sendFollowUpMessage === "function") {
				bridge.sendFollowUpMessage({ prompt: text }).catch(() => undefined);
				renderPayload({ ...state.payload, answer: "Your question is with the support agent now.", suggestedReplies: [], sources: [] }, text);
				return;
			}
			window.parent?.postMessage({ source: "resolvedesk-widget", type: "ask", message: text }, "*");
		}

		document.getElementById("composer").addEventListener("submit", (event) => {
			event.preventDefault();
			ask(messageInput.value);
		});
		document.getElementById("handoff").addEventListener("click", () => {
			const text = messageInput.value.trim() || "Customer requested a human support agent.";
			if (typeof bridge.callTool === "function") {
				bridge.callTool("resolvedesk.handoff", { message: text }).then(() => {
					renderPayload({ ...state.payload, answer: "A human-support handoff is queued. Someone will follow up shortly.", suggestedReplies: [], sources: [] }, text);
				}).catch(() => undefined);
				return;
			}
			window.parent?.postMessage({ source: "resolvedesk-widget", type: "handoff", message: text }, "*");
		});
		window.addEventListener("message", (event) => {
			if (event.data?.source !== "resolvedesk-host" || event.data.type !== "reply") return;
			renderPayload(event.data.payload, event.data.question);
		});
		for (const eventName of ["openai:set_globals", "ryu:set_globals"]) window.addEventListener(eventName, () => renderPayload(bridge.toolOutput ?? fallback));

		const initialQuestion = bridge.toolInput?.message;
		state.messages = [{ role: "assistant", text: state.payload.answer ?? fallback.answer }];
		renderPayload(state.payload, initialQuestion);
	</script>
</body>
</html>

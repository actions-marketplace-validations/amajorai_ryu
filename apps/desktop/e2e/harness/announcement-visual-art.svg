<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Announcement visual release artwork</title>
  <desc id="desc">A cyan and violet orbital announcement mark.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.55" stop-color="#164e63" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="0.35" stop-color="#67e8f9" stop-opacity="0.8" />
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="720" height="360" rx="36" fill="url(#background)" />
  <circle cx="360" cy="180" r="130" fill="url(#glow)" opacity="0.55" />
  <g fill="none" stroke="#a5f3fc" stroke-width="3" opacity="0.8">
    <ellipse cx="360" cy="180" rx="170" ry="58" transform="rotate(-18 360 180)" />
    <ellipse cx="360" cy="180" rx="170" ry="58" transform="rotate(42 360 180)" />
    <circle cx="360" cy="180" r="58" />
  </g>
  <circle cx="360" cy="180" r="17" fill="#ffffff" />
  <circle cx="220" cy="130" r="7" fill="#f0abfc" />
  <circle cx="520" cy="246" r="6" fill="#f0abfc" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Uploaded custom announcement icon</title>
  <desc id="desc">A small orbital mark used as a custom uploaded icon.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="#07111f" />
  <circle cx="128" cy="128" r="82" fill="url(#plate)" opacity="0.35" />
  <g fill="none" stroke="#fef3c7" stroke-width="6" opacity="0.9">
    <ellipse cx="128" cy="128" rx="92" ry="30" transform="rotate(-22 128 128)" />
    <ellipse cx="128" cy="128" rx="92" ry="30" transform="rotate(42 128 128)" />
  </g>
  <circle cx="128" cy="128" r="16" fill="#ffffff" />
  <circle cx="52" cy="92" r="8" fill="#f0abfc" />
  <circle cx="202" cy="170" r="7" fill="#f0abfc" />
